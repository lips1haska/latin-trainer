<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Тренажёр по девяти лексическим минимумам медицинской латыни">
<title>Латынь · Тренажёр</title>
<style>
:root{color-scheme:dark;--bg:#10141a;--panel:#1a222c;--edge:#344453;--ink:#f2f6fa;--muted:#aebecd;--mint:#9de8ca;--red:#ffb0a4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% 0,#20313a,transparent 650px),var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
main{max-width:880px;margin:auto;padding:44px 20px}header{margin-bottom:25px}.eyebrow{color:var(--mint);letter-spacing:.14em;font-size:.75rem;font-weight:750;text-transform:uppercase}h1{font-size:clamp(2.25rem,7vw,4rem);letter-spacing:-.05em;margin:0;line-height:1.12}p{margin:.45em 0;color:var(--muted)}.filters,.stats,.options{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.stats{margin:16px 0;grid-template-columns:repeat(3,minmax(0,1fr))}
label{display:grid;gap:5px;color:var(--muted);font-size:.9rem}button,select,input{font:inherit;color:var(--ink);border:1px solid var(--edge);border-radius:12px;background:#15202a;padding:12px}button,select{cursor:pointer}button:hover:not(:disabled){border-color:var(--mint)}:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.stat,article{border:1px solid var(--edge);background:var(--panel);border-radius:16px}.stat{padding:10px 14px;color:var(--muted);font-size:.85rem}.stat strong{display:block;color:var(--ink);font-size:1.25rem}.track{height:6px;background:var(--edge);border-radius:8px;overflow:hidden;margin:0 0 18px}.bar{height:100%;width:0;background:var(--mint);transition:width .2s}
article{padding:clamp(16px,4vw,34px);min-height:300px;box-shadow:0 15px 44px #0003}h2{font-size:clamp(1.5rem,4vw,2.4rem);margin:.25em 0 .6em;overflow-wrap:anywhere}.option{text-align:left}.option span{margin-right:10px;color:var(--muted)}.good{border-color:var(--mint);color:var(--mint)}.bad{border-color:var(--red);color:var(--red)}button:disabled{cursor:default}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:0}.primary{background:var(--mint);color:#14251e;border-color:var(--mint);font-weight:750}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.feedback{margin-top:16px}.hint{font-size:.85rem;margin-top:12px}footer{margin-top:20px;font-size:.85rem;color:var(--muted)}
@media(max-width:530px){main{padding-top:28px}.options,.filters{grid-template-columns:1fr}.stat{padding:8px}}
.analysis{margin-top:14px;padding:14px 18px;border:1px solid var(--edge);border-radius:16px;background:var(--panel)}
.analysis summary{cursor:pointer;color:var(--mint);font-weight:700}
.analysis-term{color:var(--ink);font-weight:700;margin:12px 0 6px}
.analysis dl{display:grid;grid-template-columns:minmax(115px,1fr) 2fr;gap:6px 14px;margin:0}
.analysis dt{color:var(--muted)}.analysis dd{margin:0;overflow-wrap:anywhere}
</style>
<main>
<header><div class="eyebrow">Медицинская латынь</div><h1>Тренажёр слов</h1><p>Запоминай перевод, словарную форму и род существительных.</p></header>
<div class="filters">
<label>Словарь<select id="deck"></select></label>
<label>Режим<select id="mode"><option value="learn">Заучивание · смешанный режим</option><option value="choice">Выбор из четырёх</option><option value="write">Ввод латинской формы</option><option value="translate">Перевод на русский</option><option value="flash">Карточки</option><option value="review">Повторить ошибки</option></select></label>
</div>
<div class="stats"><div class="stat"><strong id="total">0</strong>В словаре</div><div class="stat"><strong id="mastered">0</strong>Выучено</div><div class="stat"><strong id="mistakes">0</strong>На повторение</div></div>
<div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div>
<article aria-label="Текущий вопрос">
<div id="kind" class="eyebrow"></div><h2 id="prompt" tabindex="-1"></h2>
<div id="question"></div><div id="feedback" class="feedback" role="status"></div><div id="actions" class="actions"></div>
</article>
<details id="word-analysis" class="analysis" hidden>
  <summary>Разбор слова</summary>
  <div id="analysis-content"></div>
</details>
<footer id="storage">Прогресс сохраняется в этом браузере. Долготу гласных при вводе можно опускать.</footer>
</main>
<script src="words.js"></script><script src="morphology.js"></script><script src="trainer.js"></script>
</html>
